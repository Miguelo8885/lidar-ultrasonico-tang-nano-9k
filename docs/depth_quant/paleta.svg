<text x="24" y="285" font-size="12" fill="#6b6b6b">Rangos en mm. El índice 0 incluye todo lo más cercano que 200 mm. Botella a 300 mm → índice 3 (amarillo); botella a 600 mm → índice 12 (azul).</text>
