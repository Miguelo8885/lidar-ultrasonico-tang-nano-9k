<text x="96" y="385" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic" class="">Escala: índices 0 a 14 de D_NEAR a D_NEAR + 480 mm en pasos de 32 mm (rojo → morado); índice 15 = fondo (negro), d_mm ≥ D_NEAR + 480.</text>
<text x="96" y="407" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic" class="">Con D_NEAR = 200: botella a 300 mm → 3 (amarillo), botella a 600 mm → 12 (azul), pared y sin eco → 15. Módulo combinacional.</text>
