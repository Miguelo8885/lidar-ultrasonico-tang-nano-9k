<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/></marker></defs>
<rect width="1500" height="880" fill="#fff"/>
<text x="24" y="30" font-size="19" font-weight="bold" fill="#1a1a1a">hcsr04_ctrl: diagrama de transición de estados</text>
<text x="24" y="50" font-size="12.5" fill="#6b6b6b">Salida Moore (trig) dentro de los estados; salidas Mealy (t_us ← …, done) en los arcos como condición / salida; los arcos se evalúan en el flanco de subida de clk</text>
<g transform="translate(0,50)">
<circle cx="230" cy="250" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="230" y="228" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">IDLE</text>
<text x="230" y="247" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 000</text>
<text x="230" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">trig: 0</text>
<circle cx="600" cy="250" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="600" y="228" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">TRIG</text>
<text x="600" y="247" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 001</text>
<text x="600" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">trig: 1</text>
<text x="600" y="288" font-size="11" text-anchor="middle" fill="#6b6b6b">límite: 12 µs</text>
<circle cx="970" cy="250" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="970" y="228" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">WAIT_RISE</text>
<text x="970" y="247" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 010</text>
<text x="970" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">trig: 0</text>
<text x="970" y="288" font-size="11" text-anchor="middle" fill="#6b6b6b">límite: 5 000 µs</text>
<circle cx="970" cy="640" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="970" y="618" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">MEASURE</text>
<text x="970" y="637" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 011</text>
<text x="970" y="658" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">trig: 0</text>
<text x="970" y="678" font-size="11" text-anchor="middle" fill="#6b6b6b">límite: 5 000 µs</text>
<circle cx="600" cy="640" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="600" y="618" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">WAIT_FALL</text>
<text x="600" y="637" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 100</text>
<text x="600" y="658" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">trig: 0</text>
<text x="600" y="678" font-size="11" text-anchor="middle" fill="#6b6b6b">límite: 40 000 µs</text>
<circle cx="230" cy="640" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="230" y="634" font-size="15" text-anchor="middle" font-weight="bold" fill="#6b6b6b">101, 110, 111</text>
<text x="230" y="656" font-size="12" text-anchor="middle" fill="#6b6b6b">(no usados)</text>
<path d="M100,95 Q130,130 179.1,199.1" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="92" y="88" font-size="14" font-style="italic" text-anchor="end">Reset</text>
<path d="M298.8,237.0 Q415,215 529.3,236.6" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="415" y="212" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic">start</text>
<path d="M668.8,237.0 Q785,215 899.3,236.6" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="785" y="212" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic">tdone</text>
<path d="M984.1,318.6 Q1010,445 984.5,569.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1020" y="450" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic">echo</text>
<path d="M915.6,294.0 Q760,420 642.3,581.8" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="740" y="395" font-size="13" text-anchor="end" fill="#9a3d12" font-weight="bold" font-style="italic"><tspan text-decoration="overline">echo</tspan>·tdone</text>
<text x="740" y="413" font-size="13" text-anchor="end" fill="#9a3d12" font-weight="bold" font-style="italic">/ t_us ← T_MAX</text>
<text x="740" y="430" font-size="11.5" text-anchor="end" fill="#6b6b6b" font-weight="normal" font-style="italic">(sin eco)</text>
<path d="M902.9,620.1 Q785,585 669.0,619.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="785" y="572" font-size="13" text-anchor="middle" fill="#9a3d12" font-weight="bold" font-style="italic"><tspan text-decoration="overline">echo</tspan> / t_us ← cnt</text>
<path d="M903.4,661.6 Q785,700 668.5,662.2" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="785" y="722" font-size="13" text-anchor="middle" fill="#9a3d12" font-weight="bold" font-style="italic">echo·tdone / t_us ← T_MAX</text>
<text x="785" y="739" font-size="11.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-style="italic">(eco demasiado largo)</text>
<path d="M557.2,584.6 Q430,420 284.9,296.6" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="400" y="438" font-size="13" text-anchor="end" fill="#9a3d12" font-weight="bold" font-style="italic"><tspan text-decoration="overline">echo</tspan> + tdone</text>
<text x="400" y="456" font-size="13" text-anchor="end" fill="#9a3d12" font-weight="bold" font-style="italic">/ done = 1</text>
<path d="M230.0,570.0 Q230,445 230.0,322.0" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="242" y="450" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic">1</text>
<path d="M166.1,278.5 C98.7,330.5 98.7,169.5 164.2,220.7" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="100" y="255" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">start</tspan></text>
<path d="M571.5,186.1 C519.5,118.7 680.5,118.7 629.3,184.2" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="600" y="120" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">tdone</tspan></text>
<path d="M1033.9,221.5 C1101.3,169.5 1101.3,330.5 1035.8,279.3" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1095" y="255" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">echo</tspan>·<tspan text-decoration="overline">tdone</tspan></text>
<path d="M1033.9,611.5 C1101.3,559.5 1101.3,720.5 1035.8,669.3" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1095" y="645" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic">echo·<tspan text-decoration="overline">tdone</tspan></text>
<path d="M628.5,703.9 C680.5,771.3 519.5,771.3 570.7,705.8" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="600" y="780" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic">echo·<tspan text-decoration="overline">tdone</tspan></text>
<rect x="1150" y="330" width="320" height="262" rx="8" fill="#fafafa" stroke="#d4d4d4"/>
<text x="1164" y="356" font-size="11.5" fill="#6b6b6b" xml:space="preserve">Moore: trig dentro de cada estado</text>
<text x="1164" y="377" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  (pasa por un flip-flop: 1 ciclo de retraso)</text>
<text x="1164" y="398" font-size="11.5" fill="#6b6b6b" xml:space="preserve">Mealy en los arcos (condición / salida):</text>
<text x="1164" y="419" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  t_us ← ...  se carga el resultado (load)</text>
<text x="1164" y="440" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  done = 1    pulso de un ciclo</text>
<text x="1164" y="461" font-size="11.5" fill="#6b6b6b" xml:space="preserve">Arcos en rojo: activan una salida Mealy</text>
<text x="1164" y="482" font-size="11.5" fill="#6b6b6b" xml:space="preserve">tdone = tick · (cnt == límite del estado)</text>
<text x="1164" y="503" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  TRIG 12 µs · WAIT_RISE RISE_MAX</text>
<text x="1164" y="524" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  MEASURE T_MAX · WAIT_FALL FALL_MAX</text>
<text x="1164" y="545" font-size="11.5" fill="#6b6b6b" xml:space="preserve">cnt vuelve a 0 en cada cambio de estado</text>
<text x="1164" y="566" font-size="11.5" fill="#6b6b6b" xml:space="preserve">En los demás arcos: done = 0 y t_us se mantiene</text>
</g></svg>