<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#1a1a1a"/></marker></defs>
<rect width="1500" height="880" fill="#fff"/>
<text x="24" y="30" font-size="19" font-weight="bold" fill="#1a1a1a">mem_monitor: diagrama de transición de estados</text>
<text x="24" y="50" font-size="12.5" fill="#6b6b6b">Byte que se envía (Moore) dentro de los estados; acciones Mealy en los arcos como condición / acción; los arcos se evalúan en el flanco de subida de clk</text>
<g transform="translate(0,50)">
<circle cx="230" cy="250" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="230" y="228" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">IDLE</text>
<text x="230" y="247" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 000</text>
<text x="230" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">byte: ninguno</text>
<text x="230" y="288" font-size="11" text-anchor="middle" fill="#6b6b6b">espera we</text>
<circle cx="600" cy="250" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="600" y="228" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">CHAR_P</text>
<text x="600" y="247" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 001</text>
<text x="600" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">byte: 'P'</text>
<text x="600" y="288" font-size="11" text-anchor="middle" fill="#6b6b6b">1 byte</text>
<circle cx="970" cy="250" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="970" y="228" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">HEADER</text>
<text x="970" y="247" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 010</text>
<text x="970" y="268" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">byte: hex(hdr[87:84])</text>
<text x="970" y="288" font-size="11" text-anchor="middle" fill="#6b6b6b">22 dígitos</text>
<circle cx="970" cy="640" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="970" y="618" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">DUMP</text>
<text x="970" y="637" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 011</text>
<text x="970" y="658" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">byte: hex(rdata)</text>
<text x="970" y="678" font-size="11" text-anchor="middle" fill="#6b6b6b">256 dígitos</text>
<circle cx="600" cy="640" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="600" y="618" font-size="15" text-anchor="middle" font-weight="bold" fill="#1f3fbf">CHAR_NL</text>
<text x="600" y="637" font-size="12.5" text-anchor="middle" fill="#6b6b6b">S = 100</text>
<text x="600" y="658" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic">byte: salto de línea</text>
<text x="600" y="678" font-size="11" text-anchor="middle" fill="#6b6b6b">1 byte</text>
<circle cx="230" cy="640" r="70" fill="#fff" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="230" y="634" font-size="15" text-anchor="middle" font-weight="bold" fill="#6b6b6b">101, 110, 111</text>
<text x="230" y="656" font-size="12" text-anchor="middle" fill="#6b6b6b">(no usados)</text>
<path d="M100,95 Q130,130 179.1,199.1" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="92" y="88" font-size="14" font-style="italic" text-anchor="end">Reset</text>
<path d="M298.8,237.0 Q415,215 529.3,236.6" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="415" y="196" font-size="13" text-anchor="middle" fill="#9a3d12" font-weight="bold" font-style="italic">we / hdr ← datos del punto</text>
<text x="415" y="212" font-size="11.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-style="italic">(cap)</text>
<path d="M668.8,237.0 Q785,215 899.3,236.6" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="785" y="212" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic">bdone</text>
<path d="M984.1,318.6 Q1010,445 984.5,569.5" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1020" y="440" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic">bdone·lastH</text>
<text x="1020" y="458" font-size="11.5" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic">(22.º dígito enviado)</text>
<path d="M901.6,625.2 Q785,600 670.4,624.8" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="785" y="590" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic">bdone·lastD</text>
<text x="785" y="572" font-size="11.5" text-anchor="middle" fill="#6b6b6b" font-weight="normal" font-style="italic">(dirección 255 enviada)</text>
<path d="M557.2,584.6 Q430,420 284.9,296.6" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="405" y="438" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="normal" font-style="italic">bdone</text>
<path d="M230.0,570.0 Q230,445 230.0,322.0" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="242" y="450" font-size="13" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic">1</text>
<path d="M166.1,278.5 C98.7,330.5 98.7,169.5 164.2,220.7" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="100" y="255" font-size="13" text-anchor="end" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">we</tspan></text>
<path d="M571.5,186.1 C519.5,118.7 680.5,118.7 629.3,184.2" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="600" y="120" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">bdone</tspan></text>
<path d="M1033.9,221.5 C1101.3,169.5 1101.3,330.5 1035.8,279.3" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1095" y="245" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">bdone</tspan> + <tspan text-decoration="overline">lastH</tspan></text>
<text x="1095" y="263" font-size="13" text-anchor="start" fill="#9a3d12" font-weight="bold" font-style="italic">con bdone / hdr ← hdr·0000</text>
<path d="M1033.9,611.5 C1101.3,559.5 1101.3,720.5 1035.8,669.3" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="1095" y="645" font-size="13" text-anchor="start" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">bdone</tspan> + <tspan text-decoration="overline">lastD</tspan></text>
<path d="M628.5,703.9 C680.5,771.3 519.5,771.3 570.7,705.8" fill="none" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="600" y="780" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="normal" font-style="italic"><tspan text-decoration="overline">bdone</tspan></text>
<rect x="1150" y="330" width="330" height="240" rx="8" fill="#fafafa" stroke="#d4d4d4"/>
<text x="1164" y="356" font-size="11.5" fill="#6b6b6b" xml:space="preserve">Moore: el byte que se envía depende del estado</text>
<text x="1164" y="377" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  hex(x) = dígito hexadecimal en ASCII</text>
<text x="1164" y="398" font-size="11.5" fill="#6b6b6b" xml:space="preserve">Mealy en los arcos rojos (condición / acción)</text>
<text x="1164" y="419" font-size="11.5" fill="#6b6b6b" xml:space="preserve">bdone: uart_tx terminó de enviar un byte</text>
<text x="1164" y="440" font-size="11.5" fill="#6b6b6b" xml:space="preserve">cnt cuenta bdone y vuelve a 0 en cada</text>
<text x="1164" y="461" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  cambio de estado; raddr = cnt</text>
<text x="1164" y="482" font-size="11.5" fill="#6b6b6b" xml:space="preserve">lastH = (cnt == 21)   lastD = (cnt == 255)</text>
<text x="1164" y="503" font-size="11.5" fill="#6b6b6b" xml:space="preserve">start del siguiente byte: 2 ciclos después</text>
<text x="1164" y="524" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  de cap o de bdone (salvo en CHAR_NL)</text>
<text x="1164" y="545" font-size="11.5" fill="#6b6b6b" xml:space="preserve">Una línea: 1 + 22 + 256 + 1 = 280 bytes</text>
</g></svg>