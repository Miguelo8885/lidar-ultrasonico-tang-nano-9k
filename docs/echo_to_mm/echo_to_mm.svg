<text x="96" y="400" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic" class="">d = 343 m/s · t / 2 = 0,1715 mm/µs  ≈  11/64 = 0,171875  (+0,22 %);   11t = 8t + 2t + t;   ÷64 = desplazar 6 a la derecha (trunca)</text>
<text x="96" y="422" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic" class="">Ancho mínimo: 16 bits alcanzan mientras 11t ≤ 65 535, es decir t ≤ 5 957 µs. hcsr04_ctrl satura en T_MAX = 5 000 µs → 859 mm.</text>
<text x="96" y="444" font-size="11" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic" class="">Módulo combinacional: sin reloj ni reset.</text>
