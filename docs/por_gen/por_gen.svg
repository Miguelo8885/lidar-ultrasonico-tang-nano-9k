<text x="40" y="430" font-size="10.5" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic" class="">Es el único registro del diseño sin entrada de reset: es el que genera el reset. Con EN = listo' el contador se detiene en 1111…1 y rst_por no vuelve a subir.</text>
<text x="40" y="450" font-size="10.5" text-anchor="start" fill="#6b6b6b" font-weight="normal" font-style="italic" class="">rst_por alimenta la red de reset: rst_btn = rst_por (tick_gen, sync_ff, debounce) y rst = rst_por + pressed_S2 (el resto del sistema).</text>
