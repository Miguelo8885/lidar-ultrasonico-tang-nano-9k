<rect width="1720" height="900" fill="#fff"/>
<text x="24" y="30" font-size="19" font-weight="bold" fill="#1a1a1a">scan_fsm (versión final): diagrama de transición de estados</text>
<text x="24" y="50" font-size="12.5" fill="#6b6b6b">Todas las salidas son Moore (dentro de los estados); en los arcos solo van condiciones; los arcos se evalúan en el flanco de subida de clk</text>
