<rect x="1350" y="590" width="330" height="230" rx="8" fill="#fafafa" stroke="#d4d4d4"/>
<text x="1364" y="616" font-size="11.5" fill="#6b6b6b" xml:space="preserve">Salidas Moore (dentro de los estados):</text>
<text x="1364" y="637" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  start en FIRE; we y step en WRITE;</text>
<text x="1364" y="658" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  running = 1 en todo estado menos IDLE</text>
<text x="1364" y="679" font-size="11.5" fill="#6b6b6b" xml:space="preserve">third: el done que llega es del 3.er disparo</text>
<text x="1364" y="700" font-size="11.5" fill="#6b6b6b" xml:space="preserve">fdone: pasaron N frames (GAP)</text>
<text x="1364" y="721" font-size="11.5" fill="#6b6b6b" xml:space="preserve">       o RET frames (RETURN)</text>
<text x="1364" y="742" font-size="11.5" fill="#6b6b6b" xml:space="preserve">press tiene prioridad en todos los estados</text>
<text x="1364" y="763" font-size="11.5" fill="#6b6b6b" xml:space="preserve">  (WRITE igual completa el punto)</text>
<text x="1364" y="784" font-size="11.5" fill="#6b6b6b" xml:space="preserve">N = 4, RET = 10</text>
</g></svg>